name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: studytrack_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Линтер
        run: ruff check . && ruff format --check .
      - name: Тесты на SQLite с покрытием
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=85
      - name: Тесты на PostgreSQL
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/studytrack_test
        run: pytest -q
      - name: Миграции применяются и совпадают с моделями
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/studytrack_test
        run: alembic upgrade head && alembic check

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Проверка типов и сборка
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Сборка образов
        run: docker compose build
        env:
          SECRET_KEY: ci-secret-key-only-for-build-0123456789abcdef
          POSTGRES_PASSWORD: ci
